<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vigil-AI — Live Monitoring</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:        #0a0a0c;
  --panel:     #16171b;
  --panel-2:   #1c1d22;
  --border:    rgba(255,255,255,0.07);
  --border-2:  rgba(255,255,255,0.12);
  --track:     #26272c;

  --fg:        #f2f2f0;
  --muted:     #9b9ba2;
  --faint:     #5c5c63;

  --critical:  #ff5a5a;
  --high:      #ff9f40;
  --medium:    #f5c244;
  --low:       #4d9fff;
  --benign:    #3ecf7e;
  --escalate:  #b285ff;

  --r-sm: 7px;
  --r-md: 10px;
  --r-lg: 14px;
}

*{ box-sizing:border-box; margin:0; padding:0; }
html{ color-scheme: dark; }

body{
  background: var(--bg);
  color: var(--fg);
  font-family: 'Inter', sans-serif;
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}

a{ color: inherit; text-decoration: none; }
button{ font-family: inherit; }
::selection{ background: rgba(178,133,255,0.18); color: var(--fg); }
:focus-visible{ outline: 2px solid var(--escalate); outline-offset: 2px; border-radius: var(--r-sm); }

.shell{ max-width: 1180px; margin: 0 auto; padding: 0 28px; }

/* ---------- topbar ---------- */

.topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:16px 28px; border-bottom:1px solid var(--border);
  position: sticky; top: 0; z-index: 40;
  background: rgba(10,10,12,0.9); backdrop-filter: blur(10px);
}
.topbar-left{ display:flex; align-items:center; }
.topbar-right{ display:flex; align-items:center; gap: 16px; }

.logo{
  font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:16px;
  display:flex; align-items:center; gap:8px; margin-right:28px;
}
.logo .dot{ width:6px; height:6px; border-radius:50%; background:var(--benign); box-shadow:0 0 8px var(--benign); }

.tabs{ display:flex; align-items:center; gap:2px; }
.tabs a{ font-size:13.5px; color:var(--muted); padding:8px 14px; border-radius:8px; white-space:nowrap; }
.tabs a:hover{ color:var(--fg); }
.tabs a.active{ background:var(--fg); color:#0a0a0c; font-weight:600; border-radius:999px; }

.help-link{ font-size:13.5px; color:var(--muted); padding:8px 14px; border-radius:8px; }
.help-link:hover{ color:var(--fg); }

.demo-pill{
  font-family:'JetBrains Mono'; font-size:10.5px; letter-spacing:0.03em; color:var(--muted);
  display:flex; align-items:center; gap:7px; padding:6px 11px;
  border:1px solid var(--border-2); border-radius:999px;
}
.demo-pill .pulse{ width:6px; height:6px; border-radius:50%; background:var(--escalate); animation: pulse 2s ease-in-out infinite; }
.demo-pill.live .pulse{ background: var(--benign); }
@keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:.35; } }

/* ---------- buttons ---------- */

.btn{
  display:inline-flex; align-items:center; gap:7px;
  padding:9px 16px; border-radius:9px; font-size:13px; font-weight:600;
  border:1px solid var(--border-2); background:var(--panel); color:var(--fg);
  cursor:pointer; transition: border-color .15s ease, background .15s ease, transform .12s ease;
}
.btn:hover{ border-color:var(--faint); }
.btn:active{ transform: scale(0.98); }
.btn.primary{ background:var(--fg); color:#0a0a0c; border:none; }
.btn.primary:hover{ background:#dcdbd8; }
.btn:disabled{ opacity:.45; cursor:not-allowed; }

/* ---------- card / badges ---------- */

.card{ background:var(--panel); border:1px solid var(--border); border-radius:14px; position:relative; overflow:hidden; }

.sev-badge{
  font-family:'JetBrains Mono'; font-size:10px; letter-spacing:0.02em;
  padding:3px 8px; border-radius:999px; display:inline-flex; align-items:center; gap:5px; flex-shrink:0;
}
.sev-badge::before{ content:''; width:5px; height:5px; border-radius:50%; }
.sev-critical{ color:var(--critical); background:rgba(255,90,90,0.12); } .sev-critical::before{ background:var(--critical); }
.sev-high{ color:var(--high); background:rgba(255,159,64,0.12); } .sev-high::before{ background:var(--high); }
.sev-medium{ color:var(--medium); background:rgba(245,194,68,0.12); } .sev-medium::before{ background:var(--medium); }

.mono{ font-family:'JetBrains Mono'; }

/* ============================================================
   PAGE
   ============================================================ */

.page{ padding: 34px 0 90px; }

.page-header{ display:flex; align-items:flex-end; justify-content:space-between; margin-bottom: 22px; gap: 16px; flex-wrap: wrap; }
.page-header h1{ font-family:'Space Grotesk'; font-size: 21px; font-weight:600; margin-bottom: 5px; }
.page-header p{ font-size: 13.5px; color: var(--muted); }

.layout{ display:grid; grid-template-columns: 1.6fr 1fr; gap: 20px; align-items:start; }
@media (max-width: 980px){ .layout{ grid-template-columns: 1fr; } }

/* ---------- camera grid ---------- */

.camera-grid{ display:grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 620px){ .camera-grid{ grid-template-columns: 1fr; } }

.camera-card{ transition: border-color .2s ease; }
.camera-card.alert{ border-color: rgba(255,90,90,0.45); }

.cam-feed{
  aspect-ratio: 16/10;
  position: relative;
  background:
    radial-gradient(ellipse at 30% 20%, rgba(178,133,255,0.08), transparent 55%),
    repeating-linear-gradient(0deg, #18191e, #18191e 2px, #131418 2px, #131418 4px);
  overflow: hidden;
}
.camera-card.offline .cam-feed{ filter: grayscale(1) brightness(0.5); }
.camera-card.analyzing .cam-feed::after{
  content:''; position:absolute; inset:0;
  background: linear-gradient(180deg, transparent 0%, rgba(178,133,255,0.12) 50%, transparent 100%);
  animation: scan 2.6s linear infinite;
}
@keyframes scan{ 0%{ transform: translateY(-100%); } 100%{ transform: translateY(100%); } }

.cam-top{ position:absolute; top:10px; left:10px; right:10px; display:flex; justify-content:space-between; align-items:flex-start; z-index:2; }
.cam-id{
  font-family:'JetBrains Mono'; font-size:10.5px; color:var(--fg);
  background: rgba(10,10,12,0.7); padding:4px 8px; border-radius:5px; border:1px solid var(--border);
}
.cam-status{
  font-family:'JetBrains Mono'; font-size:9.5px; font-weight:600; letter-spacing:0.04em;
  display:flex; align-items:center; gap:5px;
  padding:4px 8px; border-radius:999px; background: rgba(10,10,12,0.7); border:1px solid var(--border);
}
.cam-status .d{ width:6px; height:6px; border-radius:50%; }
.cam-status.live .d{ background: var(--benign); animation: pulse 2s ease-in-out infinite; }
.cam-status.live{ color: var(--benign); }
.cam-status.analyzing .d{ background: var(--escalate); animation: pulse 1.4s ease-in-out infinite; }
.cam-status.analyzing{ color: var(--escalate); }
.cam-status.alert .d{ background: var(--critical); animation: pulse 0.9s ease-in-out infinite; }
.cam-status.alert{ color: var(--critical); }
.cam-status.offline .d{ background: var(--faint); }
.cam-status.offline{ color: var(--faint); }

.cam-clock{
  position:absolute; bottom:10px; right:10px; z-index:2;
  font-family:'JetBrains Mono'; font-size:10.5px; color:var(--muted);
  background: rgba(10,10,12,0.7); padding:3px 8px; border-radius:5px; border:1px solid var(--border);
}

.cam-alert-tag{
  position:absolute; bottom:10px; left:10px; right: 90px; z-index:2;
  font-size:11px; color: var(--critical); font-weight:600;
  background: rgba(10,10,12,0.75); padding:5px 9px; border-radius:6px; border:1px solid rgba(255,90,90,0.3);
  white-space: nowrap; overflow:hidden; text-overflow:ellipsis;
}

.cam-footer{ padding: 12px 14px; display:flex; align-items:baseline; justify-content:space-between; }
.cam-name{ font-size:13px; font-weight:600; }
.cam-loc{ font-size:11.5px; color: var(--faint); }

/* ---------- incident list ---------- */

.incidents-panel{ padding: 6px; }
.incidents-head{ padding: 14px 16px 8px; display:flex; align-items:baseline; justify-content:space-between; }
.incidents-head h3{ font-family:'Space Grotesk'; font-size:13.5px; font-weight:600; }
.incidents-head span{ font-family:'JetBrains Mono'; font-size:11px; color:var(--faint); }

.incident-row{
  border-top: 1px solid var(--border); padding: 13px 16px; cursor:pointer;
  display:flex; align-items:flex-start; gap:11px; transition: background .15s ease;
}
.incident-row:first-of-type{ border-top:none; }
.incident-row:hover{ background: var(--panel-2); }
.incident-row.reviewed{ opacity: 0.55; }

.incident-row .ir-body{ flex:1; min-width:0; }
.ir-top{ display:flex; align-items:center; gap:8px; margin-bottom:6px; flex-wrap: wrap; }
.ir-time{ font-family:'JetBrains Mono'; font-size:11px; color:var(--faint); }
.ir-title{ font-size:13px; font-weight:600; margin-bottom:4px; line-height:1.35; }
.ir-cam{ font-size:11.5px; color:var(--faint); }
.ir-reviewed-tag{ font-family:'JetBrains Mono'; font-size:9.5px; color:var(--benign); }

/* ---------- modal ---------- */

.modal-backdrop{
  display:none; position:fixed; inset:0; background: rgba(6,6,8,0.72);
  z-index:100; align-items:center; justify-content:center; padding:24px;
}
.modal-backdrop.show{ display:flex; }

.modal{
  width:100%; max-width: 560px; max-height: 88vh; overflow-y:auto;
  background: var(--panel); border:1px solid var(--border-2); border-radius: var(--r-lg); padding: 28px;
}

.modal-head{ display:flex; align-items:center; gap:10px; margin-bottom: 16px; }
.modal-time{ font-family:'JetBrains Mono'; font-size:12px; color:var(--muted); margin-left:auto; }

.modal h2{ font-family:'Space Grotesk'; font-size:18px; font-weight:600; margin-bottom: 4px; }
.modal .modal-cam{ font-size:12.5px; color:var(--faint); margin-bottom: 20px; }

.evidence-frame{
  aspect-ratio: 16/7; border-radius: var(--r-md);
  background: repeating-linear-gradient(0deg, #18191e, #18191e 2px, #131418 2px, #131418 4px);
  border: 1px solid var(--border); display:flex; align-items:center; justify-content:center;
  color: var(--faint); font-size:12px; font-family:'JetBrains Mono'; margin-bottom: 18px;
}

.m-section{ margin-bottom: 18px; }
.m-section .label{ font-size:10.5px; color:var(--faint); margin-bottom:7px; font-family:'JetBrains Mono'; letter-spacing:0.03em; }
.m-section p{ font-size:13.5px; color:var(--fg); line-height:1.6; }

.chip-row{ display:flex; flex-wrap:wrap; gap:6px; }
.chip{ font-size:11.5px; padding:5px 10px; border-radius:999px; background:var(--panel-2); border:1px solid var(--border-2); color:var(--muted); }

.tl-item{ display:flex; gap:10px; font-size:12.5px; margin-bottom:6px; }
.tl-item .tt{ font-family:'JetBrains Mono'; color:var(--muted); flex-shrink:0; width:62px; }

.modal-actions{ display:flex; gap:10px; margin-top: 22px; padding-top: 18px; border-top:1px solid var(--border); flex-wrap: wrap; }
.modal-actions .btn{ flex:1; justify-content:center; min-width: 130px; }

.modal-feedback{ display:none; margin-top:14px; font-size:12px; color: var(--muted); background: var(--panel-2); border:1px solid var(--border); padding:10px 12px; border-radius: var(--r-sm); }
.modal-feedback.show{ display:block; }

.close-x{
  width:28px; height:28px; border-radius:50%; background:var(--panel-2); border:1px solid var(--border-2);
  display:flex; align-items:center; justify-content:center; color:var(--muted); cursor:pointer; flex-shrink:0;
}
.close-x:hover{ color:var(--fg); }

</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <div class="logo"><span class="dot"></span>VIGIL&nbsp;·&nbsp;AI</div>
    <div class="tabs">
      <a href="home.html">Home</a>
      <a href="live.html" class="active">Live Monitoring</a>
    </div>
  </div>
  <div class="topbar-right">
    <a href="help.html" class="help-link">Help</a>
    <div class="demo-pill"><span class="pulse"></span>DEMO · SIMULATED DATA</div>
  </div>
</div>

<div class="page">
  <div class="shell">

    <div class="page-header">
      <div>
        <h1>Live Monitoring</h1>
        <p>Monitor active camera feeds and review AI-detected incidents in real time.</p>
      </div>
      <div class="demo-pill live"><span class="pulse"></span>DEMO LIVE FEED</div>
    </div>

    <div class="layout">

      <div class="camera-grid" id="cameraGrid"></div>

      <div class="incidents-panel card">
        <div class="incidents-head"><h3>Live incidents</h3><span id="incidentCount"></span></div>
        <div id="incidentList"></div>
      </div>

    </div>

  </div>
</div>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <div class="modal-head">
      <span class="sev-badge" id="modalSev"></span>
      <span class="modal-time mono" id="modalTime"></span>
      <div class="close-x" id="closeModal">✕</div>
    </div>
    <h2 id="modalTitle"></h2>
    <div class="modal-cam" id="modalCam"></div>

    <div class="evidence-frame">Relevant video frame</div>

    <div class="m-section"><div class="label">AI ASSESSMENT</div><p id="modalConfidence"></p></div>
    <div class="m-section"><div class="label">WHAT HAPPENED</div><p id="modalDesc"></p></div>
    <div class="m-section"><div class="label">DETECTED</div><div class="chip-row" id="modalChips"></div></div>
    <div class="m-section"><div class="label">EVENT TIMELINE</div><div id="modalTimeline"></div></div>
    <div class="m-section"><div class="label">RECOMMENDED ACTION</div><p id="modalAction"></p></div>

    <div class="modal-actions">
      <button class="btn" id="markReviewedBtn">Mark Reviewed</button>
      <button class="btn" id="viewFootageBtn">View Footage</button>
      <button class="btn primary" id="genReportBtn">Generate Report</button>
    </div>
    <div class="modal-feedback" id="modalFeedback"></div>
  </div>
</div>

<script>
const sevLabel = { critical:'CRITICAL', high:'HIGH', medium:'MEDIUM' };

const cameras = [
  { id:'cam-01', name:'CAM-01', location:'Main Entrance', status:'live' },
  { id:'cam-02', name:'CAM-02', location:'Vault Entrance', status:'alert', alertTitle:'Possible armed intrusion' },
  { id:'cam-03', name:'CAM-03', location:'Warehouse Floor', status:'analyzing' },
  { id:'cam-04', name:'CAM-04', location:'Loading Dock', status:'live' }
];

const incidents = [
  { id:'inc-1', timestamp:'22:07:22', title:'Possible armed intrusion', severity:'critical', confidence:'High confidence',
    camera:'CAM-02 · Vault Entrance',
    description:'An individual was observed carrying a concealed object consistent with a weapon near the vault entrance.',
    detected:['Person','Concealed object','Vault zone'],
    timeline:[{t:'22:07:22',label:'Individual enters frame'},{t:'22:07:29',label:'Concealed object flagged'}],
    recommendedAction:'Immediate human verification', status:'unreviewed' },
  { id:'inc-2', timestamp:'22:41:03', title:'Restricted-area entry', severity:'high', confidence:'High confidence',
    camera:'CAM-04 · Loading Dock',
    description:'A person entered the loading dock restricted zone outside scheduled hours.',
    detected:['Person','Restricted zone'],
    timeline:[{t:'22:41:03',label:'Zone boundary crossed'}],
    recommendedAction:'Requires human verification', status:'unreviewed' },
  { id:'inc-3', timestamp:'21:58:47', title:'Loitering detected', severity:'medium', confidence:'Medium confidence',
    camera:'CAM-01 · Main Entrance',
    description:'A person remained near the main entrance for longer than the configured loitering threshold.',
    detected:['Person','Dwell time: 7m 40s'],
    timeline:[{t:'21:58:47',label:'Person enters frame'},{t:'22:06:27',label:'Loitering threshold exceeded'}],
    recommendedAction:'Review when convenient', status:'reviewed' }
];

/* ---------- camera grid ---------- */
function renderCameras(){
  const grid = document.getElementById('cameraGrid');
  grid.innerHTML = '';
  cameras.forEach(cam=>{
    const card = document.createElement('div');
    card.className = `camera-card card ${cam.status === 'alert' ? 'alert' : ''} ${cam.status}`;
    card.innerHTML = `
      <div class="cam-feed">
        <div class="cam-top">
          <span class="cam-id">${cam.name}</span>
          <span class="cam-status ${cam.status}"><span class="d"></span>${cam.status.toUpperCase()}</span>
        </div>
        ${cam.status === 'alert' ? `<div class="cam-alert-tag">⚠ ${cam.alertTitle}</div>` : ''}
        <span class="cam-clock" data-clock>22:14:0${Math.floor(Math.random()*9)}</span>
      </div>
      <div class="cam-footer">
        <span class="cam-name">${cam.name}</span>
        <span class="cam-loc">${cam.location}</span>
      </div>
    `;
    grid.appendChild(card);
  });
}

/* ---------- incident list ---------- */
function renderIncidents(){
  const openCount = incidents.filter(i=>i.status !== 'reviewed').length;
  document.getElementById('incidentCount').textContent = `${openCount} open`;
  const list = document.getElementById('incidentList');
  list.innerHTML = '';
  incidents.forEach(inc=>{
    const row = document.createElement('div');
    row.className = `incident-row ${inc.status === 'reviewed' ? 'reviewed' : ''}`;
    row.dataset.id = inc.id;
    row.innerHTML = `
      <div class="ir-body">
        <div class="ir-top">
          <span class="sev-badge sev-${inc.severity}">${sevLabel[inc.severity]}</span>
          <span class="ir-time mono">${inc.timestamp}</span>
          ${inc.status === 'reviewed' ? '<span class="ir-reviewed-tag">✓ REVIEWED</span>' : ''}
        </div>
        <div class="ir-title">${inc.title}</div>
        <div class="ir-cam">${inc.camera}</div>
      </div>
    `;
    row.addEventListener('click', ()=> openModal(inc.id));
    list.appendChild(row);
  });
}

/* ---------- modal ---------- */
const modalBackdrop = document.getElementById('modalBackdrop');
const modalFeedback = document.getElementById('modalFeedback');
let activeIncidentId = null;

function openModal(id){
  const inc = incidents.find(i=>i.id===id);
  activeIncidentId = id;
  modalFeedback.classList.remove('show');

  document.getElementById('modalSev').className = `sev-badge sev-${inc.severity}`;
  document.getElementById('modalSev').textContent = sevLabel[inc.severity];
  document.getElementById('modalTime').textContent = inc.timestamp;
  document.getElementById('modalTitle').textContent = inc.title;
  document.getElementById('modalCam').textContent = inc.camera;
  document.getElementById('modalConfidence').textContent = inc.confidence;
  document.getElementById('modalDesc').textContent = inc.description;
  document.getElementById('modalChips').innerHTML = inc.detected.map(d=>`<span class="chip">${d}</span>`).join('');
  document.getElementById('modalTimeline').innerHTML = inc.timeline.map(t=>
    `<div class="tl-item"><span class="tt mono">${t.t}</span><span>${t.label}</span></div>`
  ).join('');
  document.getElementById('modalAction').textContent = inc.recommendedAction;

  const reviewedBtn = document.getElementById('markReviewedBtn');
  reviewedBtn.textContent = inc.status === 'reviewed' ? 'Reviewed ✓' : 'Mark Reviewed';
  reviewedBtn.disabled = inc.status === 'reviewed';

  modalBackdrop.classList.add('show');
}

document.getElementById('closeModal').addEventListener('click', ()=> modalBackdrop.classList.remove('show'));
modalBackdrop.addEventListener('click', (e)=>{ if(e.target === modalBackdrop) modalBackdrop.classList.remove('show'); });

document.getElementById('markReviewedBtn').addEventListener('click', ()=>{
  const inc = incidents.find(i=>i.id===activeIncidentId);
  inc.status = 'reviewed';
  renderIncidents();
  document.getElementById('markReviewedBtn').textContent = 'Reviewed ✓';
  document.getElementById('markReviewedBtn').disabled = true;
  modalFeedback.textContent = 'Marked as reviewed. Simulated action — no external team was notified.';
  modalFeedback.classList.add('show');
});

document.getElementById('viewFootageBtn').addEventListener('click', ()=>{
  const inc = incidents.find(i=>i.id===activeIncidentId);
  modalFeedback.textContent = `Simulated: opening recorded footage for ${inc.camera}.`;
  modalFeedback.classList.add('show');
});

document.getElementById('genReportBtn').addEventListener('click', ()=>{
  const inc = incidents.find(i=>i.id===activeIncidentId);
  const text = `VIGIL-AI INCIDENT REPORT (DEMO / SIMULATED)
========================================

Incident: ${inc.title}
Timestamp: ${inc.timestamp}
Source: ${inc.camera}
Assessment: ${inc.confidence}

Summary:
${inc.description}

Detected objects:
${inc.detected.join(', ')}

Timeline:
${inc.timeline.map(t=>`${t.t} — ${t.label}`).join('\n')}

Recommended action: ${inc.recommendedAction}

----------------------------------------
This is a simulated report generated from demo data.
No real footage or verified incident is represented.
`;
  const blob = new Blob([text], {type:'text/plain'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `vigil-ai-report-${inc.id}.txt`;
  a.click();
  URL.revokeObjectURL(url);

  modalFeedback.textContent = 'Incident report generated and downloaded.';
  modalFeedback.classList.add('show');
});

renderCameras();
renderIncidents();
</script>
</body>
</html>
