<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vigil-AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0f;
    --fg:#f4f3ef;
    --muted:#9a9aa0;
    --muted-2:#68686e;
    --violet:#8b5cf6;
    --magenta:#c026d3;
    --cyan:#3fd1c9;
    --red:#ff4d4d;
    --line:rgba(244,243,239,0.09);
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  html,body{
    background:var(--bg);
    color:var(--fg);
    font-family:'Inter', sans-serif;
    overflow-x:hidden;
    height:100%;
    overflow:hidden;
  }

  .mono{ font-family:'JetBrains Mono', monospace; }

  /* ---------- NAV ---------- */
  nav{
    position:relative;
    z-index:10;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:28px 56px;
    max-width:1440px;
    margin:0 auto;
  }
  .logo{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:19px;
    letter-spacing:0.02em;
    color:#f2f2f0;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .logo .dot{
    width:7px; height:7px;
    border-radius:50%;
    background:#3ecf7e;
    box-shadow:0 0 8px #3ecf7e;
  }
  .nav-links{
    display:flex;
    align-items:center;
    gap:40px;
  }
  .nav-links a{
    color:var(--muted);
    text-decoration:none;
    font-size:14px;
    letter-spacing:0.01em;
    transition:color .2s ease;
  }
  .nav-links a:hover{ color:var(--fg); }

  .pill-btn{
    display:inline-flex;
    align-items:center;
    gap:9px;
    background:var(--fg);
    color:#0a0a0f;
    border:none;
    padding:11px 20px 11px 16px;
    border-radius:999px;
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:13px;
    letter-spacing:0.02em;
    cursor:pointer;
    text-decoration:none;
    transition:transform .2s ease, background .2s ease;
  }
  .pill-btn:hover{ background:var(--violet); color:#fff; transform:translateY(-1px); }
  .pill-btn:focus-visible{ outline:2px solid var(--cyan); outline-offset:3px; }
  .pill-btn .rec{
    width:7px; height:7px;
    border-radius:50%;
    background:var(--red);
  }

  /* ---------- HERO ---------- */
  .hero{
    position:relative;
    max-width:1440px;
    margin:0 auto;
    height:calc(100vh - 84px);
    min-height:520px;
    display:flex;
    align-items:center;
    padding:0 56px;
  }

  .hero-copy{
    position:relative;
    z-index:5;
    max-width:560px;
    margin-left:auto;
    padding:34px 0;
  }

  h1{
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:52px;
    line-height:1.08;
    letter-spacing:-0.01em;
    color:var(--fg);
    margin-bottom:26px;
  }
  h1 em{
    font-style:normal;
    background:linear-gradient(90deg, var(--violet), var(--magenta));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  .sub{
    font-size:16.5px;
    line-height:1.6;
    color:var(--muted);
    margin-bottom:38px;
    max-width:460px;
  }

  .cta-row{
    display:flex;
    align-items:center;
    gap:28px;
  }

  .ghost-link{
    color:var(--fg);
    text-decoration:none;
    font-size:14px;
    font-weight:500;
    border-bottom:1px solid var(--line);
    padding-bottom:2px;
    transition:border-color .2s ease, color .2s ease;
  }
  .ghost-link:hover{ border-color:var(--fg); }

  /* ---------- FRAME STREAM ---------- */
  .stream-wrap{
    position:absolute;
    left:-8%;
    top:-6%;
    width:64%;
    height:112%;
    overflow:visible;
    pointer-events:none;
  }

  .glow{
    position:absolute;
    width:900px; height:900px;
    left:0; top:0;
    offset-path: path("M -420,-260 C -100,40 260,180 260,420 C 260,600 380,700 480,820");
    offset-rotate:0deg;
    background:radial-gradient(circle, rgba(139,92,246,0.20) 0%, rgba(192,38,211,0.14) 42%, rgba(63,209,201,0.08) 65%, rgba(10,10,15,0) 78%);
    filter:blur(34px);
    animation:travel 9s linear infinite;
  }

  .tile{
    position:absolute;
    left:0; top:0;
    width:128px;
    height:74px;
    border-radius:5px;
    background-size:cover;
    background-position:center;
    border:1px solid rgba(244,243,239,0.12);
    box-shadow:0 10px 26px rgba(0,0,0,0.55);
    offset-path: path("M -420,-260 C -100,40 260,180 260,420 C 260,600 380,700 480,820");
    offset-rotate:0deg;
    opacity:0;
    overflow:hidden;
    animation:travel 9s linear infinite, fade 9s linear infinite;
  }
  .tile .frame-img{
    position:absolute; inset:0;
    background-size:cover;
    background-position:center;
    filter:grayscale(1) contrast(1.15) brightness(0.8);
  }
  .entry-hint{position:fixed;z-index:8;left:50%;bottom:28px;transform:translateX(-50%);font:11px 'JetBrains Mono',monospace;letter-spacing:.15em;color:var(--muted);animation:entryPulse 2.4s ease-in-out infinite}.entry-hint kbd{display:inline-block;margin-right:8px;padding:4px 7px;border:1px solid var(--line);border-radius:5px;color:var(--fg);font:inherit;letter-spacing:0}.entering nav,.entering .hero-copy,.entering .stream-wrap{opacity:0;transform:scale(.985);transition:opacity .38s ease,transform .38s ease}@keyframes entryPulse{50%{opacity:.4}}
  .tile .frame-video{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:cover;
    filter:grayscale(1) contrast(1.15) brightness(0.8);
  }
  .tile.mode-nv .frame-video{
    filter:grayscale(1) sepia(1) hue-rotate(130deg) saturate(3.2) brightness(0.85) contrast(1.15);
  }
  .tile.mode-thermal .frame-video{
    filter:grayscale(1) sepia(1) hue-rotate(255deg) saturate(4.5) brightness(0.95) contrast(1.25);
  }
  .tile.mode-nv .frame-img{
    filter:grayscale(1) sepia(1) hue-rotate(130deg) saturate(3.2) brightness(0.85) contrast(1.15);
  }
  .tile.mode-thermal .frame-img{
    filter:grayscale(1) sepia(1) hue-rotate(255deg) saturate(4.5) brightness(0.95) contrast(1.25);
  }
  .tile .grain{
    position:absolute; inset:0;
    background-image:radial-gradient(rgba(255,255,255,0.5) 0.5px, transparent 0.5px);
    background-size:3px 3px;
    opacity:0.12;
    mix-blend-mode:overlay;
  }
  .tile .scan{
    position:absolute; inset:0;
    background:repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0.18) 0px,
      rgba(0,0,0,0.18) 1px,
      transparent 1px,
      transparent 3px
    );
    mix-blend-mode:multiply;
  }
  .tile .vignette{
    position:absolute; inset:0;
    box-shadow:inset 0 0 22px 6px rgba(0,0,0,0.65);
  }
  .tile::after{
    content:"";
    position:absolute;
    top:6px; left:6px;
    width:14px; height:14px;
    border-top:1.5px solid var(--cyan);
    border-left:1.5px solid var(--cyan);
    opacity:0.85;
    z-index:2;
  }
  .tile.mode-thermal::after{ border-color:var(--magenta); }
  .tile.mode-cctv::after{ border-color:rgba(244,243,239,0.55); }

  .tile .rec-tag{
    position:absolute;
    top:5px; right:6px;
    display:flex;
    align-items:center;
    gap:3px;
    font-family:'JetBrains Mono', monospace;
    font-size:6.5px;
    color:rgba(244,243,239,0.7);
    letter-spacing:0.02em;
    z-index:2;
  }
  .tile .rec-tag .d{
    width:4px; height:4px;
    border-radius:50%;
    background:var(--red);
  }
  .tile .ts{
    position:absolute;
    bottom:5px; left:7px;
    font-family:'JetBrains Mono', monospace;
    font-size:6.5px;
    color:rgba(244,243,239,0.6);
    letter-spacing:0.01em;
    z-index:2;
  }

  @keyframes travel{
    0%{ offset-distance:0%; }
    100%{ offset-distance:100%; }
  }
  @keyframes fade{
    0%{ opacity:0; }
    8%{ opacity:1; }
    82%{ opacity:1; }
    100%{ opacity:0; }
  }

  .hero::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(180deg, rgba(10,10,15,0) 70%, var(--bg) 100%);
    pointer-events:none;
    z-index:4;
  }

  @media (max-width: 880px){
    html,body{ overflow-y:auto; }
    nav{ padding:22px 24px; }
    .nav-links{ display:none; }
    .hero{ padding:0 24px; min-height:640px; }
    .hero-copy{ margin:0 auto; padding:40px 0; max-width:100%; }
    h1{ font-size:36px; }
    .stream-wrap{ width:100%; left:-30%; opacity:0.5; }
  }

  @media (prefers-reduced-motion: reduce){
    .tile, .glow{ animation:none; opacity:0; }
  }
  .mobile-entry {
  display: none;
}

@media (max-width: 1024px) {
  .desktop-entry {
    display: none;
  }

  .mobile-entry {
    display: inline;
  }
}
</style>
</head>
<body>

<nav>
  <div class="logo"><span class="dot"></span>VIGIL&nbsp;·&nbsp;AI</div>
</nav>

<div class="hero">
  <div class="stream-wrap" id="streamWrap">
    <div class="glow"></div>
    <!-- tiles injected by JS -->
  </div>

  <div class="hero-copy">
    <h1>Hours of footage,<br>turned into <em>answers</em>.</h1>
    <p class="sub">Vigil-AI watches every camera you already own, flags what matters the moment it happens, and lets your team find any incident with a single search — no more scrubbing through timelines by hand.</p>
  </div>
</div>

<div class="entry-hint">
  <span class="desktop-entry"><kbd>SPACE</kbd> TO ENTER</span>
  <span class="mobile-entry">CLICK ANYWHERE TO ENTER</span>
</div>
<script>
  const wrap = document.getElementById('streamWrap');
  const count = 11;
  const modes = ['cctv','cctv','cctv','mode-nv','mode-thermal'];
  const footage = [
    {type:'video', src:'assets/camera-01.mp4'},
    {type:'image', src:'assets/camera-grid.jpg'},
    {type:'image', src:'assets/camera-ai-detection.jpg'},
    {type:'video', src:'assets/camera-02.mp4'},
    {type:'image', src:'assets/camera-night.jpg'}
  ];

  for(let i=0;i<count;i++){
    const t = document.createElement('div');
    const mode = modes[Math.floor(Math.random()*modes.length)];
    t.className = 'tile ' + mode;

    const delay = -((i / count) * 9).toFixed(2);
    const dur = (8.5 + Math.random()*1.5).toFixed(2);
    const scale = (0.72 + Math.random()*0.55).toFixed(2);
    t.style.animationDelay = `${delay}s, ${delay}s`;
    t.style.animationDuration = `${dur}s, ${dur}s`;
    t.style.transform = `scale(${scale})`;

    const hh = String(20 + Math.floor(Math.random()*3)).padStart(2,'0');
    const mm = String(Math.floor(Math.random()*60)).padStart(2,'0');
    const ss = String(Math.floor(Math.random()*60)).padStart(2,'0');
    const camNum = String(1 + Math.floor(Math.random()*12)).padStart(2,'0');
    const media = footage[i % footage.length];
    const label = mode === 'mode-nv' ? 'IR' : (mode === 'mode-thermal' ? 'THERMAL' : 'REC');

    t.innerHTML = `
      ${media.type === 'video'
        ? `<video class="frame-video" src="${media.src}" autoplay muted loop playsinline></video>`
        : `<div class="frame-img" style="background-image:url('${media.src}')"></div>`}
      <div class="scan"></div>
      <div class="grain"></div>
      <div class="vignette"></div>
      <div class="rec-tag"><span class="d"></span>${label}</div>
      <div class="ts">CAM-${camNum} ${hh}:${mm}:${ss}</div>
    `;
    wrap.appendChild(t);
  }
</script>
<script>
  let entering = false;
  document.body.tabIndex = -1;
  document.body.focus({ preventScroll: true });
  function enterApplication(event){
    if(event) event.preventDefault();
    if(entering) return;
    entering = true;
    document.body.classList.add('entering');
    setTimeout(() => { window.location.href = 'home.html'; }, 380);
  }
  // Capture Space before the browser can use it for a page-level action.
  function handleSpace(event){
    const pressedSpace = event.code === 'Space' || event.key === ' ' || event.key === 'Spacebar';
    if(!pressedSpace || event.repeat || entering) return;
    const target = event.target;
    if(target && /INPUT|TEXTAREA|SELECT|BUTTON/.test(target.tagName)) return;
    event.preventDefault();
    event.stopPropagation();
    enterApplication();
  }
  window.addEventListener('keydown', handleSpace, true);
  window.addEventListener('keyup', handleSpace, true);
  document.body.addEventListener('click', event => {
    if(!event.target.closest('a, button, input, select, textarea')) enterApplication(event);
  });
</script>

</body>
</html>
